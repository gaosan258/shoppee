<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge Deposit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d0d0d; color: #fff; padding: 20px; max-width: 480px; margin: 0 auto; text-align: center; }
        .header { font-size: 20px; font-weight: bold; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        label { font-size: 14px; color: #aaa; display: block; margin-bottom: 12px; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 18px; text-align: center; outline: none; margin-bottom: 20px; }
        input:focus { border-color: #d4af37; }
        button { width: 100%; background: linear-gradient(135deg, #ffb700, #ff8800); color: #000; font-weight: bold; padding: 14px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; }
        .back-btn { color: #888; text-decoration: none; display: inline-block; margin-top: 25px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">Recharge Deposit</div>

    <div class="card">
        <label for="depositAmount">Enter Deposit Amount ($)</label>
        <input type="number" id="depositAmount" placeholder="0.00" min="1">
        <button onclick="submitDeposit()">Confirm Deposit</button>
    </div>

    <a href="index.html" class="back-btn">← Back to Homepage</a>

    <script>
        function submitDeposit() {
            const amount = document.getElementById('depositAmount').value;
            if(!amount || amount <= 0) {
                alert('Please enter a valid amount!');
                return;
            }

            fetch('/api/deposit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert('Deposit Successful! New Balance: $' + data.newBalance.toFixed(2));
                    window.location.href = 'index.html';
                } else {
                    alert('Deposit Failed!');
                }
            });
        }
    </script>
</body>
</html>
