<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #121212; color: #fff; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .balance-title { color: #888; font-size: 14px; }
        .balance-amount { font-size: 32px; color: #ffb700; font-weight: bold; margin: 5px 0 15px 0; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-deposit { background: #28a745; color: white; }
        .btn-withdraw { background: #17a2b8; color: white; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; color: #ccc; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; font-size: 14px; }
        th { background: #2a2a2a; color: #ffb700; }
        .status-pending { color: #ffc107; font-weight: bold; }
        .status-approved { color: #28a745; font-weight: bold; }
        .status-rejected { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>Welcome, <span id="username">User</span></h2>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Balance Card -->
    <div class="card">
        <div class="balance-title">Account Balance</div>
        <div class="balance-amount">$<span id="balance">0.00</span></div>
        <div class="btn-group">
            <button class="btn btn-deposit" onclick="openModal('deposit')">Deposit (ငွေသွင်း)</button>
            <button class="btn btn-withdraw" onclick="openModal('withdraw')">Withdraw (ငွေထုတ်)</button>
        </div>
    </div>

    <!-- History Section -->
    <div class="card">
        <h3>Transaction History (ငွေသွင်း/ငွေထုတ် မှတ်တမ်း)</h3>
        <table>
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Method</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="historyTable">
                <!-- Data loaded via JS -->
            </tbody>
        </table>
    </div>

    <!-- Deposit/Withdraw Modal -->
    <div class="modal" id="txModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom: 15px; color: #ffb700;">Deposit</h3>
            <form id="txForm">
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="txMethod">
                        <option value="KBZPay">KBZPay</option>
                        <option value="WavePay">WavePay</option>
                        <option value="CBPay">CBPay</option>
                        <option value="USDT">USDT (TRC20)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" step="0.01" id="txAmount" required>
                </div>
                <div class="form-group">
                    <label>Account Info / TxID</label>
                    <input type="text" id="txAccount" placeholder="e.g. 09xxxxxx or TxID" required>
                </div>
                <button type="submit" class="btn btn-deposit" style="width: 100%; margin-top: 10px;">Submit Request</button>
                <button type="button" onclick="closeModal()" style="width: 100%; margin-top: 5px; padding: 8px; background: #555; color: white; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        let currentAction = 'deposit';

        function loadProfile() {
            fetch('/api/user/profile')
                .then(res => {
                    if (res.status === 401) window.location.href = '/login.html';
                    return res.json();
                })
                .then(data => {
                    if (data.success) {
                        document.getElementById('username').innerText = data.user.username;
                        document.getElementById('balance').innerText = data.user.balance.toFixed(2);
                    }
                });
            loadHistory();
        }

        function loadHistory() {
            fetch('/api/user/history')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const tbody = document.getElementById('historyTable');
                        tbody.innerHTML = '';
                        data.history.forEach(tx => {
                            tbody.innerHTML += `
                                <tr>
                                    <td style="text-transform: capitalize;">${tx.type}</td>
                                    <td>$${tx.amount.toFixed(2)}</td>
                                    <td>${tx.method}</td>
                                    <td class="status-${tx.status}">${tx.status.toUpperCase()}</td>
                                    <td>${new Date(tx.created_at).toLocaleDateString()}</td>
                                </tr>
                            `;
                        });
                    }
                });
        }

        function openModal(action) {
            currentAction = action;
            document.getElementById('modalTitle').innerText = action === 'deposit' ? 'Deposit Request' : 'Withdraw Request';
            document.getElementById('txModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('txModal').style.display = 'none';
        }

        document.getElementById('txForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const amount = document.getElementById('txAmount').value;
            const method = document.getElementById('txMethod').value;
            const account_info = document.getElementById('txAccount').value;

            fetch(`/api/user/${currentAction}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount, method, account_info })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.success) {
                    closeModal();
                    loadProfile();
                }
            });
        });

        function logout() {
            fetch('/api/logout', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/login.html';
                    }
                });
        }

        loadProfile();
    </script>
</body>
</html>
