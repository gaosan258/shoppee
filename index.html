<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-white font-sans flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-gray-900 min-h-screen shadow-2xl flex flex-col justify-between pb-16">
        
        <!-- Header Section with Language Selector -->
        <div class="p-4 bg-gray-900 border-b border-gray-800 flex justify-between items-center">
            <span class="text-lg font-bold" data-i18n="home">Home</span>
            <select id="langSelect" onchange="changeLanguage(this.value)" class="text-sm bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-lg text-gray-300 focus:outline-none">
                <option value="en">English</option>
                <option value="my">မြန်မာ</option>
                <option value="ar">العربية</option>
                <option value="zh">中文</option>
            </select>
        </div>

        <!-- Balance Card -->
        <div class="p-4">
            <div class="bg-gradient-to-r from-gray-800 to-gray-900 border border-gray-800 rounded-2xl p-5 shadow-inner">
                <div class="flex items-center space-x-3 mb-4">
                    <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center text-xl">👤</div>
                    <div>
                        <div class="text-sm text-gray-400">Yahya Ali</div>
                        <div class="text-xl font-bold text-amber-400">$0.24</div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-800 text-center text-sm">
                    <div>
                        <div class="text-gray-400">0</div>
                        <div class="text-xs text-gray-500" data-i18n="task_earnings">Task Earnings ($)</div>
                    </div>
                    <div>
                        <div class="text-gray-400">0</div>
                        <div class="text-xs text-gray-500" data-i18n="today_profit">Today Profit ($)</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Grid (Deposit, Withdraw, Invite) -->
        <div class="px-4 grid grid-cols-3 gap-3 text-center">
            <a href="deposit.html" class="bg-gray-900 border border-gray-800 hover:bg-gray-800 p-4 rounded-xl flex flex-col items-center transition">
                <span class="text-2xl mb-1">📦</span>
                <span class="text-sm" data-i18n="deposit">Deposit</span>
            </a>
            <a href="withdraw.html" class="bg-gray-900 border border-gray-800 hover:bg-gray-800 p-4 rounded-xl flex flex-col items-center transition">
                <span class="text-2xl mb-1">💳</span>
                <span class="text-sm" data-i18n="withdraw">Withdraw</span>
            </a>
            <a href="#" class="bg-gray-900 border border-gray-800 hover:bg-gray-800 p-4 rounded-xl flex flex-col items-center transition">
                <span class="text-2xl mb-1">👥</span>
                <span class="text-sm" data-i18n="invite">Invite</span>
            </a>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="fixed bottom-0 w-full max-w-md bg-gray-900 border-t border-gray-800 flex justify-around py-3 text-xs text-gray-400">
            <a href="index.html" class="flex flex-col items-center text-amber-400">🏠<span data-i18n="home">Home</span></a>
            <a href="grab.html" class="flex flex-col items-center">📋<span data-i18n="orders">Orders</span></a>
            <div class="relative -top-4">
                <div class="w-14 h-14 bg-amber-400 rounded-full flex items-center justify-center text-black font-bold text-lg shadow-lg border-4 border-gray-900">GO</div>
            </div>
            <a href="chat.html" class="flex flex-col items-center">💬<span data-i18n="service">Service</span></a>
            <a href="profile.html" class="flex flex-col items-center">👤<span data-i18n="profile">Profile</span></a>
        </div>
    </div>

    <!-- Multi-language Script Support -->
    <script>
        const translations = {
            en: { home: "Home", task_earnings: "Task Earnings ($)", today_profit: "Today Profit ($)", deposit: "Deposit", withdraw: "Withdraw", invite: "Invite", orders: "Orders", service: "Service", profile: "Profile" },
            my: { home: "ပင်မစာမျက်နှာ", task_earnings: "တာဝန်မှရငွေ ($)", today_profit: "ယနေ့အမြတ် ($)", deposit: "ငွေသွင်းရန်", withdraw: "ငွေထုတ်ရန်", invite: "ဖိတ်ကြားရန်", orders: "မှာယူမှုများ", service: "ဝန်ဆောင်မှု", profile: "အကောင့်" },
            ar: { home: "الصفحة الرئيسية", task_earnings: "عوائد المهمة ($)", today_profit: "الأرباح اليوم ($)", deposit: "إداع", withdraw: "سحب", invite: "دعوة", orders: "الطلبات", service: "الخدمة", profile: "حسابي" },
            zh: { home: "首页", task_earnings: "任务收益 ($)", today_profit: "今日利润 ($)", deposit: "充值", withdraw: "提现", invite: "邀请", orders: "订单", service: "客服", profile: "我的" }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selectedLang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
            // Handle RTL/LTR direction support
            if(lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('selectedLang') || 'en';
            document.getElementById('langSelect').value = savedLang;
            changeLanguage(savedLang);
        }
    </script>
</body>
</html>
