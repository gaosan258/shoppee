<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-white font-sans flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-gray-900 min-h-screen shadow-2xl p-6 flex flex-col justify-center">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-amber-400 mb-2">Welcome Back</h1>
            <p class="text-sm text-gray-400">Please sign in to your account</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Username</label>
                <input type="text" id="username" required placeholder="Enter your username" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" id="password" required placeholder="Enter your password" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-400">
            </div>
            
            <div id="errorMsg" class="text-red-500 text-xs hidden"></div>

            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-black font-bold p-4 rounded-xl shadow-lg mt-4 hover:opacity-90 transition">
                Sign In
            </button>
        </form>

        <div class="text-center mt-6 text-sm text-gray-400">
            Don't have an account? <a href="#" class="text-amber-400 hover:underline">Contact Admin</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    window.location.href = '/index.html';
                } else {
                    errorMsg.innerText = data.message || 'Login failed';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'Server error. Please try again.';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
