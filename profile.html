<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d0d0d; color: #fff; padding: 20px; max-width: 480px; margin: 0 auto; }
        .header { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .user-card { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #333; display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .avatar { width: 60px; height: 60px; background: #d4af37; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #000; }
        .username { font-size: 18px; font-weight: bold; }
        
        .info-card { background: #1a1a1a; padding: 15px 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }
        .item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .item:last-child { border-bottom: none; }
        .value { color: #d4af37; font-weight: bold; }
        
        .back-link { text-align: center; display: block; color: #888; text-decoration: none; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">My Profile</div>

    <div class="user-card">
        <div class="avatar">👤</div>
        <div class="username" id="profileName">Selina</div>
    </div>

    <div class="info-card">
        <div class="item"><span>Total Balance</span> <span class="value" id="profileBalance">$0.00</span></div>
        <div class="item"><span>Completed Tasks</span> <span class="value" id="profileTasks">0</span></div>
        <div class="item"><span>Today Earnings</span> <span class="value" id="profileEarnings">$0.00</span></div>
    </div>

    <a href="index.html" class="back-link">← Back to Homepage</a>

    <script>
        fetch('/api/user')
            .then(res => res.json())
            .then(data => {
                document.getElementById('profileName').innerText = data.username;
                document.getElementById('profileBalance').innerText = '$' + data.balance.toFixed(2);
                document.getElementById('profileTasks').innerText = data.completedTasks;
                document.getElementById('profileEarnings').innerText = '$' + data.todayEarnings.toFixed(2);
            });
    </script>
</body>
</html>
